            hasListener: function() {},
            addRules: function() {},
            getRules: function() {},
            removeRules: function() {}
          };

          if (typeof window !== 'undefined') {

            if (!window.chrome.runtime) window.chrome.runtime = {};
            if (!window.chrome.runtime.onMessage) window.chrome.runtime.onMessage = dummyEvent;
            if (!window.chrome.runtime.onConnect) window.chrome.runtime.onConnect = dummyEvent;
            if (!window.chrome.runtime.sendMessage) window.chrome.runtime.sendMessage = function() {};
            if (!window.chrome.runtime.connect) {

            if (!window.browser.runtime) window.browser.runtime = {};
            if (!window.browser.runtime.onMessage) window.browser.runtime.onMessage = dummyEvent;
          }
        } catch (err) {}
      })();

      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || '';
        if (msg && (

          msg.indexOf('chrome.runtime') !== -1 || 
          msg.indexOf('setPlaybackSpeed') !== -1 ||
          (e.filename && e.filename.indexOf('chrome-extension') !== -1)
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
