<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LearnStudy - Distraction-free Study Player</title>
    <script>
      // Safety mock for chrome.runtime and browser.runtime to prevent "Cannot read properties of undefined (reading 'onMessage')"
      (function() {
        try {
          var dummyEvent = {
            addListener: function() {},
            removeListener: function() {},
            hasListener: function() {},
            addRules: function() {},
            getRules: function() {},
            removeRules: function() {}
          };

          if (typeof window !== 'undefined') {
            if (!window.chrome) {
              window.chrome = {};
            }
            if (!window.chrome.runtime) {
              window.chrome.runtime = {};
            }
            if (!window.chrome.runtime.onMessage) {
              window.chrome.runtime.onMessage = dummyEvent;
            }
            if (!window.chrome.runtime.onConnect) {
              window.chrome.runtime.onConnect = dummyEvent;
            }
            if (!window.chrome.runtime.sendMessage) {
              window.chrome.runtime.sendMessage = function() {};
            }
            if (!window.chrome.runtime.connect) {
              window.chrome.runtime.connect = function() {
                return {
                  onMessage: dummyEvent,
                  onDisconnect: dummyEvent,
                  postMessage: function() {}
                };
              };
            }

            // Support Firefox/Edge browser API as well
            if (!window.browser) {
              window.browser = {};
            }
            if (!window.browser.runtime) {
              window.browser.runtime = {};
            }
            if (!window.browser.runtime.onMessage) {
              window.browser.runtime.onMessage = dummyEvent;
            }
          }
        } catch (err) {
          // Silent fallback
        }
      })();

      // Gracefully silence third-party browser extension or iframe container sandbox script errors
      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || '';
        if (msg && (
          msg.indexOf('onMessage') !== -1 || 
          msg.indexOf('chrome.runtime') !== -1 || 
          msg.indexOf('setPlaybackSpeed') !== -1 ||
          (e.filename && e.filename.indexOf('chrome-extension') !== -1)
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reasonMsg = (e.reason && (e.reason.message || e.reason)) || '';
        if (typeof reasonMsg === 'string' && (
          reasonMsg.indexOf('onMessage') !== -1 || 
          reasonMsg.indexOf('chrome.runtime') !== -1 ||
          reasonMsg.indexOf('setPlaybackSpeed') !== -1
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
